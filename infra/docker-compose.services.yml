# Existing Supabase database; apply migrations before starting these services.
# Commands in docs/UPGRADE_PHASE_3_4.md are run from the repository root.
services:
  api:
    build: ..
    env_file: ../.env
    environment:
      SERVICE_MODULE: apps.api.main
      API_PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  web:
    profiles: [web]
    build:
      context: ../apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped
  line:
    profiles: [line]
    build: ..
    env_file: ../.env
    environment:
      SERVICE_MODULE: packages.line.worker
    restart: unless-stopped
  scraper:
    profiles: [collectors]
    build: ..
    env_file: ../.env
    environment:
      SERVICE_MODULE: packages.scraper.run
    restart: unless-stopped
