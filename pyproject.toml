[project]
name = "ransomwatch-th"
version = "0.1.0"
description = "RansomWatch TH - Thai ransomware victim monitoring + BD pipeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "discord-py>=2.4",
    "openai>=1.40",
    "matplotlib>=3.9",
    "feedparser>=6.0.14",
    "beautifulsoup4>=4.15.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pglast>=6",
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
pythonpath = ["."]
